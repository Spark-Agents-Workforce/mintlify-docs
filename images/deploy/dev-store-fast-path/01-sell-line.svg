<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 264" width="760" height="264" role="img" aria-label="The sell line: widget, checkout, Shopify contract, your engine, admin and portal, running on your three accounts: Shopify, Supabase, and Vercel." font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <!-- SVG loads via <img>, so webfonts can't be fetched: Google Sans Flex on the chip
       and Inter elsewhere fall back to locally installed or system faces. -->
  <line x1="25" y1="76" x2="735" y2="76" stroke="#FFDE01" stroke-width="6" stroke-linecap="round" />
  <path d="M166 70 L175 76 L166 82" fill="none" stroke="#1A150C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M306 70 L315 76 L306 82" fill="none" stroke="#1A150C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M446 70 L455 76 L446 82" fill="none" stroke="#1A150C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M586 70 L595 76 L586 82" fill="none" stroke="#1A150C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="40" y="48" width="120" height="56" rx="14" fill="#FBFBFB" stroke="#1A150C" stroke-width="1.5" />
  <text x="100" y="72" text-anchor="middle" font-size="14" font-weight="600" fill="#1A150C">Widget</text>
  <text x="100" y="90" text-anchor="middle" font-size="10.5" fill="rgba(26,21,12,0.76)">product page</text>
  <rect x="180" y="48" width="120" height="56" rx="14" fill="#FBFBFB" stroke="#1A150C" stroke-width="1.5" />
  <text x="240" y="72" text-anchor="middle" font-size="14" font-weight="600" fill="#1A150C">Checkout</text>
  <text x="240" y="90" text-anchor="middle" font-size="10.5" fill="rgba(26,21,12,0.76)">Shopify's</text>
  <rect x="320" y="48" width="120" height="56" rx="14" fill="#FBFBFB" stroke="#1A150C" stroke-width="1.5" />
  <text x="380" y="72" text-anchor="middle" font-size="14" font-weight="600" fill="#1A150C">Contract</text>
  <text x="380" y="90" text-anchor="middle" font-size="10.5" fill="rgba(26,21,12,0.76)">Shopify writes it</text>
  <rect x="460" y="48" width="120" height="56" rx="14" fill="#FBFBFB" stroke="#1A150C" stroke-width="1.5" />
  <text x="520" y="72" text-anchor="middle" font-size="14" font-weight="600" fill="#1A150C">Your engine</text>
  <text x="520" y="90" text-anchor="middle" font-size="10.5" fill="rgba(26,21,12,0.76)">mirrors it</text>
  <rect x="600" y="48" width="120" height="56" rx="14" fill="#FBFBFB" stroke="#1A150C" stroke-width="1.5" />
  <text x="660" y="72" text-anchor="middle" font-size="14" font-weight="600" fill="#1A150C">Admin + portal</text>
  <text x="660" y="90" text-anchor="middle" font-size="10.5" fill="rgba(26,21,12,0.76)">yours and theirs</text>
  <rect x="287.5" y="138.5" width="190" height="24" rx="12" fill="#000000" />
  <rect x="285" y="136" width="190" height="24" rx="12" fill="#FFDE01" stroke="#000000" stroke-width="2.47" />
  <text x="380" y="152" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing="-0.5" fill="#000000" font-family="'Google Sans Flex', Inter, -apple-system, sans-serif">YOUR THREE ACCOUNTS</text>
  <rect x="56" y="186" width="200" height="64" rx="14" fill="#FEF8CE" stroke="#1A150C" stroke-width="1.25" />
  <text x="156" y="214" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1A150C">Shopify</text>
  <text x="156" y="232" text-anchor="middle" font-size="10.5" fill="rgba(26,21,12,0.76)">the custom app you created</text>
  <rect x="280" y="186" width="200" height="64" rx="14" fill="#FEF8CE" stroke="#1A150C" stroke-width="1.25" />
  <text x="380" y="214" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1A150C">Supabase</text>
  <text x="380" y="232" text-anchor="middle" font-size="10.5" fill="rgba(26,21,12,0.76)">your database</text>
  <rect x="504" y="186" width="200" height="64" rx="14" fill="#FEF8CE" stroke="#1A150C" stroke-width="1.25" />
  <text x="604" y="214" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1A150C">Vercel</text>
  <text x="604" y="232" text-anchor="middle" font-size="10.5" fill="rgba(26,21,12,0.76)">your app</text>
