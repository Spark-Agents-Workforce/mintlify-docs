<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280" role="img" aria-label="The schedule: every minute the queues drain, every 15 minutes the watchdog checks, every hour billing and retries sweep, overnight reminders and snapshots run. All of it reports to Home and Operational health." font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <!-- SVG loads via <img>, so webfonts can't be fetched: Google Sans Flex on the chip
       and Inter elsewhere fall back to locally installed or system faces. -->
  <rect x="20" y="36" width="170" height="60" rx="14" fill="#FBFBFB" stroke="#1A150C" stroke-width="1.5" />
  <text x="105" y="60" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1A150C">Every minute</text>
  <text x="105" y="78" text-anchor="middle" font-size="10.5" fill="rgba(26,21,12,0.76)">emails, imports, bulk edits</text>
  <rect x="205" y="36" width="170" height="60" rx="14" fill="#FBFBFB" stroke="#1A150C" stroke-width="1.5" />
  <text x="290" y="60" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1A150C">Every 15 minutes</text>
  <text x="290" y="78" text-anchor="middle" font-size="10.5" fill="rgba(26,21,12,0.76)">the watchdog checks</text>
  <rect x="390" y="36" width="170" height="60" rx="14" fill="#FBFBFB" stroke="#1A150C" stroke-width="1.5" />
  <text x="475" y="60" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1A150C">Every hour</text>
  <text x="475" y="78" text-anchor="middle" font-size="10.5" fill="rgba(26,21,12,0.76)">billing sweep, retries</text>
  <rect x="575" y="36" width="170" height="60" rx="14" fill="#FBFBFB" stroke="#1A150C" stroke-width="1.5" />
  <text x="660" y="60" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1A150C">Overnight</text>
  <text x="660" y="78" text-anchor="middle" font-size="10.5" fill="rgba(26,21,12,0.76)">reminders, snapshots, cleanup</text>
  <line x1="105" y1="96" x2="105" y2="134" stroke="#1A150C" stroke-width="1.5" />
  <line x1="290" y1="96" x2="290" y2="134" stroke="#1A150C" stroke-width="1.5" />
  <line x1="475" y1="96" x2="475" y2="134" stroke="#1A150C" stroke-width="1.5" />
  <line x1="660" y1="96" x2="660" y2="134" stroke="#1A150C" stroke-width="1.5" />
  <path d="M99 128 L105 135 L111 128" fill="none" stroke="#1A150C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M284 128 L290 135 L296 128" fill="none" stroke="#1A150C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M469 128 L475 135 L481 128" fill="none" stroke="#1A150C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M654 128 L660 135 L666 128" fill="none" stroke="#1A150C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="105" y1="142" x2="660" y2="142" stroke="#FFDE01" stroke-width="6" stroke-linecap="round" />
  <rect x="300" y="158.5" width="165" height="24" rx="12" fill="#000000" />
  <rect x="297.5" y="156" width="165" height="24" rx="12" fill="#FFDE01" stroke="#000000" stroke-width="2.47" />
  <text x="380" y="172" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing="-0.5" fill="#000000" font-family="'Google Sans Flex', Inter, -apple-system, sans-serif">REPORTS TO TWO SCREENS</text>
  <rect x="140" y="196" width="220" height="64" rx="14" fill="#FEF8CE" stroke="#1A150C" stroke-width="1.25" />
  <text x="250" y="224" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1A150C">Home</text>
  <text x="250" y="242" text-anchor="middle" font-size="10.5" fill="rgba(26,21,12,0.76)">the Needs attention banner</text>
  <rect x="400" y="196" width="220" height="64" rx="14" fill="#FEF8CE" stroke="#1A150C" stroke-width="1.25" />
  <text x="510" y="224" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1A150C">Operational health</text>
  <text x="510" y="242" text-anchor="middle" font-size="10.5" fill="rgba(26,21,12,0.76)">jobs · webhooks · queues · alerts</text>
</svg>
